name: Build and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - infra/**
      - docs/**
      - '**.md'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write # OIDC login to Azure

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    # Names come from `terraform output` and are stored as environment variables in GitHub.
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE: ${{ vars.IMAGE_REPOSITORY }}:${{ github.sha }}
      WEB_APP: ${{ vars.WEB_APP_NAME }}
      WORKER_APP: ${{ vars.WORKER_APP_NAME }}
      SCHEDULER_JOB: ${{ vars.SCHEDULER_JOB_NAME }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ vars.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run database migrations
        run: |
          az containerapp job update --name "$MIGRATE_JOB" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" --output none
          execution=$(az containerapp job start --name "$MIGRATE_JOB" --resource-group "$RESOURCE_GROUP" --query name --output tsv)
          echo "Started migration job execution $execution"

          for _ in $(seq 1 90); do
            status=$(az containerapp job execution show --name "$MIGRATE_JOB" --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" --query properties.status --output tsv)
            echo "Status: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded)
                echo "::error::Migration job $execution finished with status $status. Check the job's logs in Log Analytics."
                exit 1 ;;
            esac
            sleep 10
          done

          echo "::error::Migration job $execution did not finish within 15 minutes."
          exit 1

      - name: Deploy web, worker and scheduler
        run: |
          az containerapp update --name "$WEB_APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" --output none
          az containerapp update --name "$WORKER_APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" --output none
          az containerapp job update --name "$SCHEDULER_JOB" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" --output none

      - name: Smoke test
        run: |
          fqdn=$(az containerapp show --name "$WEB_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "https://$fqdn/up" > /dev/null
          echo "Deployed ${{ github.sha }} to https://$fqdn"
