name: Terraform

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/terraform.yml
  push:
    branches:
      - main
    paths:
      - infra/terraform/**
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write # OIDC login to Azure

concurrency:
  group: terraform-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/terraform

jobs:
  plan:
    name: Plan (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_entra_client_secret: ${{ secrets.ENTRA_CLIENT_SECRET }}
      TF_VAR_mail_password: ${{ secrets.MAIL_PASSWORD }}
      TF_ENV: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="environments/${TF_ENV}.backend.hcl"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -var-file="environments/${TF_ENV}.tfvars" -out=tfplan

      - name: Upload plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ env.TF_ENV }}
          path: infra/terraform/tfplan
          retention-days: 5

  apply:
    name: Apply (${{ inputs.environment || 'dev' }})
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Add required reviewers to the environment in GitHub to gate applies.
    environment: ${{ inputs.environment || 'dev' }}

    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_ENV: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ env.TF_ENV }}
          path: infra/terraform

      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="environments/${TF_ENV}.backend.hcl"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - name: Apply
        run: terraform apply -input=false tfplan
