# Local development stack. Copy .env.example to .env first, then:
#   docker compose up -d --build
# See README.md for the full first-run steps.

name: laravel-crm

x-app: &app
  build:
    context: .
    target: development
    args:
      USER_ID: ${UID:-1000}
      GROUP_ID: ${GID:-1000}
  image: laravel-crm-dev
  volumes:
    - .:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    azurite:
      condition: service_started
    mailpit:
      condition: service_started

services:
  app:
    <<: *app
    environment:
      COMPOSER_INSTALL_ON_START: "true"
      MIGRATE_ON_START: "true"
    ports:
      - "${APP_PORT:-8000}:8080"

  vite:
    image: node:22-bookworm-slim
    working_dir: /var/www/html
    # npm ci + build, then the dev server; see the script for shutdown cleanup.
    command: [ "sh", "docker/vite-dev.sh" ]
    environment:
      VITE_HMR_HOST: localhost
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-crm}
      MYSQL_USER: ${DB_USERNAME:-crm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Azure Blob Storage emulator for attachments.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: [ "azurite-blob", "--blobHost", "0.0.0.0", "--loose", "--skipApiVersionCheck" ]
    ports:
      - "${FORWARD_AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  mysql-data:
  azurite-data:
